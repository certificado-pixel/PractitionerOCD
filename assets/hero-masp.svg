<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1400" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Ilustração estilizada do MASP, Museu de Arte de São Paulo, com seus pilares vermelhos, à noite">
  <defs>
    <linearGradient id="pillar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a0808"/>
      <stop offset="0.42" stop-color="#a8261c"/>
      <stop offset="0.82" stop-color="#d3452f"/>
      <stop offset="1" stop-color="#e9cd8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cd8a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e9cd8a" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9cd8a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e9cd8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9422f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9422f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ambient night glow -->
  <ellipse cx="290" cy="380" rx="320" ry="260" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="160" cy="950" rx="240" ry="320" fill="url(#glow2)" filter="url(#soft)"/>
  <ellipse cx="400" cy="950" rx="240" ry="320" fill="url(#glow2)" filter="url(#soft)"/>

  <!-- faint stars -->
  <g fill="#e9cd8a" opacity="0.55">
    <circle cx="90" cy="70" r="1.6"/>
    <circle cx="200" cy="130" r="1.2"/>
    <circle cx="340" cy="50" r="1.4"/>
    <circle cx="440" cy="170" r="1.6"/>
    <circle cx="60" cy="210" r="1.1"/>
    <circle cx="480" cy="90" r="1.2"/>
    <circle cx="260" cy="40" r="1.1"/>
  </g>

  <!-- suspended glass volume -->
  <g>
    <rect x="60" y="270" width="420" height="290" rx="3" fill="url(#glass)"/>
    <!-- glow behind lit windows -->
    <rect x="60" y="270" width="420" height="290" fill="#e9cd8a" opacity="0.12" filter="url(#softer)"/>

    <!-- floor bands -->
    <g stroke="#e9cd8a" stroke-opacity="0.32" stroke-width="1.2">
      <line x1="60" y1="330" x2="480" y2="330"/>
      <line x1="60" y1="390" x2="480" y2="390"/>
      <line x1="60" y1="450" x2="480" y2="450"/>
      <line x1="60" y1="510" x2="480" y2="510"/>
    </g>
    <!-- mullions -->
    <g stroke="#e9cd8a" stroke-opacity="0.18" stroke-width="1">
      <line x1="130" y1="270" x2="130" y2="560"/>
      <line x1="220" y1="270" x2="220" y2="560"/>
      <line x1="310" y1="270" x2="310" y2="560"/>
      <line x1="400" y1="270" x2="400" y2="560"/>
    </g>

    <!-- lit windows: warm, brighter, glowing -->
    <g>
      <rect x="140" y="336" width="72" height="46" fill="#f3dfae" opacity="0.85"/>
      <rect x="140" y="336" width="72" height="46" fill="#f3dfae" opacity="0.35" filter="url(#softer)"/>

      <rect x="320" y="456" width="72" height="46" fill="#f3dfae" opacity="0.7"/>
      <rect x="320" y="456" width="72" height="46" fill="#f3dfae" opacity="0.3" filter="url(#softer)"/>

      <rect x="230" y="396" width="72" height="46" fill="#e9cd8a" opacity="0.4"/>
      <rect x="410" y="336" width="60" height="46" fill="#e9cd8a" opacity="0.28"/>
      <rect x="70" y="456" width="52" height="46" fill="#e9cd8a" opacity="0.22"/>
    </g>

    <!-- crisp frame + gold rim highlight -->
    <rect x="60" y="270" width="420" height="290" rx="3" fill="none" stroke="#c9a24b" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="60" y1="271" x2="480" y2="271" stroke="#f3dfae" stroke-opacity="0.75" stroke-width="2"/>
  </g>

  <!-- two red pillars holding the volume -->
  <rect x="118" y="558" width="58" height="562" rx="8" fill="url(#pillar)"/>
  <rect x="356" y="558" width="58" height="562" rx="8" fill="url(#pillar)"/>

  <!-- pillar rim highlights -->
  <g stroke="#f3dfae" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <line x1="121" y1="562" x2="121" y2="1116"/>
    <line x1="359" y1="562" x2="359" y2="1116"/>
  </g>
  <g stroke="#2a0808" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <line x1="173" y1="562" x2="173" y2="1116"/>
    <line x1="411" y1="562" x2="411" y2="1116"/>
  </g>

  <!-- ground plaza -->
  <line x1="0" y1="1122" x2="520" y2="1122" stroke="#c9a24b" stroke-opacity="0.45" stroke-width="1.5"/>
  <g stroke="#e9cd8a" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="1156" x2="520" y2="1156"/>
    <line x1="0" y1="1190" x2="520" y2="1190"/>
    <line x1="0" y1="1224" x2="520" y2="1224"/>
  </g>

  <!-- soft ground glow under pillars -->
  <ellipse cx="147" cy="1120" rx="100" ry="26" fill="#e9cd8a" opacity="0.22" filter="url(#softer)"/>
  <ellipse cx="385" cy="1120" rx="100" ry="26" fill="#e9cd8a" opacity="0.22" filter="url(#softer)"/>
</svg>
